<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess - Menu</title>
    <style>
        :root {
            --bg-color: #111;
            --panel-bg: #1a1a1a;
            --border-color: #333;
            --accent-green: #2ecc71;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            margin: 0; background: var(--bg-color); display: flex;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; font-family: sans-serif; color: var(--text-main);
        }
        .screen {
            display: none; width: 100vw; height: 100vh; max-width: 840px; max-height: 98vh;
            background: var(--panel-bg); border: 2px solid var(--border-color);
            border-radius: 12px; flex-direction: column; box-sizing: border-box; position: relative;
        }
        .screen.active { display: flex; }
        .screen-header { display: flex; align-items: center; padding: 17px; border-bottom: 1px solid var(--border-color); background: #222; }
        .back-btn { background: #444; color: white; border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-size: 20px; font-weight: bold; }
        .screen-title { margin: 0; flex-grow: 1; text-align: center; font-size: 25px; padding-right: 56px; }
        .screen-body { padding: 28px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 17px; }
        .menu-btn { background: #262626; color: var(--text-main); border: 1px solid var(--border-color); padding: 22px; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; text-align: left; }
        .menu-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        .board-option-card { background: #222; border: 2px solid var(--border-color); padding: 22px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .board-option-card.default-board { border-color: var(--accent-green); }
        .confirm-btn { background: var(--accent-green); color: #111; border: none; padding: 11px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 17px; }
        .version-badge { background: #222; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 17px; border-radius: 22px; font-size: 17px; font-weight: bold; align-self: center; margin-top: auto; margin-bottom: 11px; }
    </style>
</head>
<body>
    <audio id="globalClickSound" src="sounds/sound2.mp3" preload="auto"></audio>

    <div id="main-screen" class="screen active">
        <div class="screen-header" style="justify-content: center;">
            <h2 class="screen-title" style="padding-right: 0;">Modern Chess</h2>
        </div>
        <div class="screen-body" style="justify-content: center;">
            <button class="menu-btn" onclick="navigateTo('offline-options-screen')">Play</button>
            <button class="menu-btn disabled">How to Play</button>
            <button class="menu-btn disabled">Files Manager</button>
            <button class="menu-btn disabled">Settings</button>
            <div class="version-badge">v3-grid24x34</div>
        </div>
    </div>

    <div id="offline-options-screen" class="screen">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('main-screen')">Back</button>
            <h2 class="screen-title">Select Board</h2>
        </div>
        <div class="screen-body">
            <div class="board-option-card default-board">
                <div class="board-info"><h3 style="margin:0; font-size:22px;">24x34 Grid Board (Simple)</h3></div>
                <button class="confirm-btn" onclick="window.location.href='game.html'">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const clickAudio = document.getElementById('globalClickSound');
        function playClickSound() {
            if (clickAudio) {
                clickAudio.currentTime = 3.4;
                clickAudio.play().catch(() => {});
            }
        }
        document.querySelectorAll('button').forEach(btn => btn.addEventListener('click', playClickSound));

        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
